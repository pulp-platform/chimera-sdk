---
name: Docker • Build Chimera Container

"on":
  push:
    branches:
      - main
      - devel
    paths:
      - "container/Dockerfile"
      - "container/Makefile"
      - "Makefile"
      - ".github/workflows/docker-build-chimera.yml"
  workflow_dispatch:

jobs:
  prepare:
    name: Fetch branch name or tag
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.generate_tag.outputs.docker_tag }}
      docker_release_tag: ${{ steps.detect_release_tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment variables
        run: |
          echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "TAG_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "IS_TAG=${GITHUB_REF_TYPE}" >> $GITHUB_ENV

      - name: Set Docker tag
        id: generate_tag
        run: |
          if [[ "${{ env.IS_TAG }}" == "tag" ]]; then
            echo "docker_tag=${{ env.TAG_NAME }}" >> $GITHUB_OUTPUT
          else
            echo "docker_tag=${{ env.BRANCH_NAME }}" >> $GITHUB_OUTPUT
          fi

      - name: Detect release tag on HEAD
        id: detect_release_tag
        run: |
          TAG_ON_HEAD=$(git tag --points-at HEAD | head -n 1 || true)
          if [[ -n "$TAG_ON_HEAD" && "$IS_TAG" != "tag" ]]; then
            echo "release_tag=$TAG_ON_HEAD" >> $GITHUB_OUTPUT
          else
            echo "release_tag=" >> $GITHUB_OUTPUT
          fi

  build-chimera:
    name: Build Chimera Image
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    outputs:
      digest-amd64: ${{ steps.digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR Log-in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add iis-git.ee.ethz.ch to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H iis-git.ee.ethz.ch >> ~/.ssh/known_hosts

      - name: Restore ccache
        id: cache
        uses: actions/cache@v4
        with:
          path: var-ccache
          key: ${{ runner.os }}-${{ matrix.platform }}-build-cache-chimera

      - name: Inject build-cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.1.0
        with:
          cache-map: |
            {
              "var-ccache": "/ccache"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Lower Case Repository Name
        run: echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Build and push Chimera image
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.platform }}
          context: .
          file: container/Dockerfile
          push: true
          ssh: default
          cache-from: type=gha
          cache-to: type=gha,mode=min
          outputs: type=image,name=ghcr.io/${{ env.OWNER_LC }}/chimera,annotation-index=true,name-canonical=true,push=true

      - name: Extract image digest
        id: digest
        run: echo "digest-${{ matrix.platform }}=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  merge-chimera-images:
    name: Merge Chimera Images
    runs-on: ubuntu-latest
    needs: [prepare, build-chimera]
    steps:
      - name: GHCR Log-in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lower Case Repository Name
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Prepare manifest tags
        id: manifest_tags
        run: |
          OWNER_LC_VALUE=${OWNER,,}
          {
            echo "tags<<EOF"
            echo "ghcr.io/${OWNER_LC_VALUE}/chimera:latest,"
            if [[ -n "${RELEASE_TAG}" ]]; then
              echo "ghcr.io/${OWNER_LC_VALUE}/chimera:${DOCKER_TAG},"
              echo "ghcr.io/${OWNER_LC_VALUE}/chimera:${RELEASE_TAG}"
            else
              echo "ghcr.io/${OWNER_LC_VALUE}/chimera:${DOCKER_TAG}"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKER_TAG: ${{ needs.prepare.outputs.docker_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.docker_release_tag }}

      - name: Merge Chimera Images
        uses: Noelware/docker-manifest-action@v1
        with:
          inputs: |
            ghcr.io/${{ env.OWNER_LC }}/chimera@${{ needs.build-chimera.outputs.digest-amd64 }},
            ghcr.io/${{ env.OWNER_LC }}/chimera@${{ needs.build-chimera.outputs.digest-arm64 }}
          tags: ${{ steps.manifest_tags.outputs.tags }}
          push: true
