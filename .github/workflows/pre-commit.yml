---
name: CI • Lint & Licenses

"on":
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit (all files)
        run: |
          # Show diffs on failure and run across the entire repository to ensure consistency
          uv run pre-commit run --show-diff-on-failure --all-files

      - name: Show git status (debug)
        if: ${{ always() }}
        run: git status --porcelain || true
