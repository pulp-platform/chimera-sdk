# Generic HS2 adapter configuration shared across targets
adapter speed 8000
adapter driver ftdi
ftdi_vid_pid 0x0403 0x6014
ftdi_layout_init 0x00e8 0x60eb
ftdi_channel 0
set irlen 5

transport select jtag
telnet_port disabled
tcl_port disabled
gdb_port 3333

# No dedicated reset line on the HS2 adapter
reset_config none
