---
variables:
  CMAKE: "riscv /usr/sepp/bin/cmake-3.28.3"
  LLVM_INSTALL_PATH: "/usr/scratch/normandie/jungvi/llvm"
  GVSOC_HOME: "/scratch/jungvi/chimera-sdk/install/gvsoc"
  # Optional pre-cloned https://github.com/pulp-platform/ITA. When empty,
  # scripts/generate_test_vectors.py clones it on demand, which needs network
  # access from the runner.
  ITA_HOME: ""

.setup:
  script:
    - bash
    - eval "$(micromamba shell hook --shell bash)"
    - micromamba activate chimera-sdk-ci
    - rm -rf build
    # Test Vector Generation
    - |
      GEN_ARGS="--skip-ita"
      if [ "$TARGET" = "chimera-convolve" ]; then
        if [ -n "$ITA_HOME" ]; then GEN_ARGS="--ita-dir $ITA_HOME"; else GEN_ARGS=""; fi
      fi
      python scripts/generate_test_vectors.py $GEN_ARGS

build_sdk:
  parallel:
    matrix:
      - TARGET: [chimera-open, chimera-host, chimera-convolve]
  script:
    - !reference [.setup, script]
    - $CMAKE -DTARGET_PLATFORM=$TARGET -DTOOLCHAIN_DIR=$LLVM_INSTALL_PATH -B build
    - $CMAKE --build build -j

test:
  parallel:
    matrix:
      - TARGET: [chimera-open]
        TEST: [test_host_returnZero, test_snitchCluster_simpleOffload]
      - TARGET: [chimera-host]
        TEST: [test_host_returnZero]
  script:
    - !reference [.setup, script]
    - $CMAKE -DTARGET_PLATFORM=$TARGET -DTOOLCHAIN_DIR=$LLVM_INSTALL_PATH -B build
    - $CMAKE --build build -j
    - cd ${GVSOC_HOME}
    - ./install/bin/gvsoc --target=chimera --binary $CI_PROJECT_DIR/build/bin/$TEST run
