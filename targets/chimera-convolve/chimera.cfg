set script_dir [file dirname [info script]]
set sdk_root [file normalize [file join $script_dir .. ..]]
source [file join $sdk_root scripts openocd interface hs2.cfg]

set _CHIPNAME riscv
# Default Cheshire JTAG ID is 0x1c5e5db3
jtag newtap $_CHIPNAME cpu -irlen ${irlen} -expected-id 0x1c5e5db3

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0

gdb_report_data_abort enable
gdb_report_register_access_error enable

riscv set_reset_timeout_sec 120
riscv set_command_timeout_sec 120

# riscv set_prefer_sba off

# Exit when debugger detaches
# $_TARGETNAME configure -event gdb-detach {
#     echo "GDB detached; ending debugging session."
#     shutdown
# }

init
halt
echo "Ready for Remote Connections."